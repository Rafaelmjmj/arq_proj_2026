spring:
  application:
    name: trokr

  # PostgreSQL (JPA) — dados estruturados e relacionados:
  # Usuario, Item, Proposta, Avaliacao, Historico.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:trokr_db}
    username: ${DB_USER:trokr_user}
    password: ${DB_PASSWORD:changeme_local_dev}

  jpa:
    hibernate:
      # ddl-auto=update é uma simplificação temporária para o início do curso:
      # o Hibernate cria/ajusta as tabelas sozinho a partir das entidades.
      # Isso será substituído por migrations versionadas (Flyway/Liquibase)
      # em uma aula futura, quando controle de schema passar a importar.
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # MongoDB (Aula 8) — dado semi-estruturado e de alto volume: LogEvento.
  # No Spring Boot 4 essas propriedades ficam em "spring.mongodb" (no Boot 3
  # eram "spring.data.mongodb"). Dentro do Compose, MONGO_HOST=mongo (nome do
  # serviço); rodando a aplicação fora do Docker, o padrão é localhost.
  mongodb:
    host: ${MONGO_HOST:localhost}
    port: ${MONGO_PORT:27017}
    database: ${MONGO_DATABASE:trokr}
    username: ${MONGO_USERNAME:trokr}
    password: ${MONGO_PASSWORD:trokr123}
    authentication-database: ${MONGO_AUTH_DB:admin}

management:
  endpoints:
    web:
      exposure:
        # Expor só o necessário nesta fase: health (usado como /health do
        # enunciado) e info. Nada de segurança/autenticação em cima disso ainda.
        include: health,info
